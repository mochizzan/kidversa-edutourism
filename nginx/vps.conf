# ─── Plain HTTP server (named vhost; aktif sampai TLS diaktifkan di atas) ───
server {
    listen 80;
    server_name edutourism.kidversa.fun;   # co-exist dengan site lain di :80

    client_max_body_size 32m;
    server_tokens off;

    # ─── ACME webroot (WAJIB tetap aktif — certbot issue & renewal) ───
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ─── Compression (Gzip) ───
    # Container frontend sudah memampatkan asetnya; lapisan ini menangani
    # response yang di-proxy langsung dari backend (JSON /api/).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    # ─── Static assets: cache aggressively (mirrors nginx/default.conf) ───
    # Pure proxy (no root/disk): forward to the frontend container, which
    # serves the file; this edge layer only stamps the cache headers.
    # nginx precedence: this regex beats plain prefix `location /` below, and
    # would beat a plain `location /api/` for any extension-ending path — API
    # routes are extensionless and `/api/` is `^~`, so no regex can shadow it.
    # `.webp` is DELIBERATELY absent from this list. This location never
    # serves bytes (no root — pure proxy), it only stamps cache headers, so
    # listing it would duplicate the container's own `expires 1y` and override
    # the upstream's `Cache-Control: max-age=0`. Worse: if a .webp path still
    # fell through to the SPA HTML fallback — the window before
    # nginx/default.conf is reloaded in the frontend container — `expires 1y`
    # would be stamped on that HTML and the browser would cache the broken
    # response for a year. OpenWA's logo (src="/openwa_logo.webp") is fixed by
    # `try_files $uri /wa$uri` in nginx/default.conf; `webp` belongs THERE.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        proxy_pass http://kidversa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SPA + static — dilayani container frontend (nginx:alpine)
    location / {
        proxy_pass http://kidversa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # API reverse proxy → backend container (Go, :8080)
    # `^~` = prefix priority: once /api/ matches, nginx NEVER checks regex
    # locations — the static-assets regex above can never add expires/
    # Cache-Control to API responses (P2-6). Pure prefix semantics unchanged.
    location ^~ /api/ {
        proxy_pass http://kidversa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;   # SSE long-lived streams
        proxy_hide_header Server;

        # Re-declare security headers (same set as nginx/default.conf; own
        # add_header present → server-level inheritance drops otherwise).
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # Backend health (no /api prefix)
    location = /health {
        proxy_pass http://kidversa_backend/health;
    }
}
