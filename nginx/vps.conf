#        2. Uncomment blok HTTPS.
#        3. Uncomment blok redirect HTTP→HTTPS (blok ini menang atas blok
#           proxy HTTP di akhir file — server_name sama, terdaftar lebih
#           dulu — sementara location ACME-nya tetap melayani renewal).
#        4. nginx -t && systemctl reload nginx

