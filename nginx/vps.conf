# Kidversa Edutourism — VPS HOST nginx (bare metal, faces the internet).
# All app traffic is reverse-proxied here. Frontend & backend run in Docker
# containers; their ports are bound to 127.0.0.1 (not public). This host nginx
# is the only thing listening on :80/:443.
#
# Deploy steps on the VPS:
#   1. Copy this file to /etc/nginx/sites-available/kidversa.conf
#      and symlink into /etc/nginx/sites-enabled/ (rm the default site).
#   2. Adjust DOMAIN, the `dist` root path, and TLS cert paths below.
#   3. nginx -t && systemctl reload nginx
#   4. docker compose -f compose.yml up -d --build   (ports bound to 127.0.0.1)

# ─── Upstreams (container services on the Docker host bridge) ───
# frontend container (nginx:alpine) and backend container (Go) are reached via
# 127.0.0.1 since compose binds them to the host loopback.
upstream kidversa_frontend {
    server 127.0.0.1:8002;
    keepalive 32;
}
upstream kidversa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

