# Kidversa Edutourism — VPS HOST nginx (reverse proxy untuk project ini).
# Frontend & backend berjalan di Docker; port container terikat ke 127.0.0.1
# (tidak publik). File ini HANYA berisi server block BERAMA — port 80/443
# DIWARISI BERSAMA dengan site lain yang sudah berjalan di VPS ini.
#
# DOMAIN PUBLIK: edutourism.kidversa.fun (tanpa suffix port).
# Semua server block di bawah memakai server_name eksplisit sehingga TIDAK
# mengambil alih default server dan TIDAK menabrak site lain.
#
# Langkah deploy di VPS (compose root = PRODUCTION-only: image GHCR, tanpa build):
#   0. Cek pemilik port 80: `ss -ltnp | grep ':80'`
#        - nginx (atau panel yang include /etc/nginx/sites-enabled/*) → aman,
#          file ini co-exist.
#        - proses selain nginx → JANGAN lanjut, laporkan balik dulu.
#   1. DNS: A record `edutourism.kidversa.fun` → IP VPS.
#   2. Salin file ini ke /etc/nginx/sites-available/kidversa.conf dan
#      symlink ke /etc/nginx/sites-enabled/ (JANGAN hapus site lain).
#   3. docker compose pull && docker compose up -d   (port terikat 127.0.0.1)
#   4. nginx -t && systemctl reload nginx
#      → site hidup di http://edutourism.kidversa.fun (blok TLS masih komentar).
#   5. Terbitkan sertifikat (lokasi ACME webroot sudah aktif di blok HTTP):
#        mkdir -p /var/www/certbot
#        certbot certonly --webroot -w /var/www/certbot -d edutourism.kidversa.fun
#   6. Go-live: uncomment blok HTTPS dan blok redirect HTTP→HTTPS di bawah
#      (domain sudah terisi), lalu nginx -t && systemctl reload nginx.
#      (Setelah redirect aktif, blok proxy HTTP di akhir file jadi tak
#       terjangkau — boleh dikomentari, struktur tetap valid apa adanya.)
#   7. Setelah HTTPS hidup, set di backend/.env VPS:
#        PARENT_REPORT_BASE_URL=https://edutourism.kidversa.fun/parent/report
#        PARENT_GALLERY_BASE_URL=https://edutourism.kidversa.fun/parent
#      lalu docker compose up -d --force-recreate backend
#      (link QR rapor/galeri memakai base URL ini).
#
# MENGAPA HTTPS WAJIB (bukan opsional): cookie auth di-hardcode `Secure`
# (env diabaikan by design) — di plain HTTP browser membuang cookie secara
# diam-diam → refresh/SSE/tenant semua 401.

# ─── Upstreams (container di Docker host bridge, loopback) ───
upstream kidversa_frontend {
    server 127.0.0.1:8002;
    keepalive 32;
}
upstream kidversa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ─── WebSocket upgrade (wss://…/wa/socket.io/) ───
# Browser menominasikan `Upgrade` sebagai hop-by-hop lewat `Connection:
# Upgrade`, sehingga nginx TIDAK meneruskannya kecuali diminta eksplisit.
# Dipadukan dengan `Connection ''` (yang hanya menyalakan upstream keepalive),
# handshake tiba di container TANPA `Upgrade` → socket.io menjawab
# 400 {"code":3,"message":"Bad request"}: polling dapat `sid`, lalu upgrade
# gagal — itulah "WebSocket connection … failed" di console production.
# Untuk request non-WebSocket `$http_upgrade` kosong → nilai `''`, jadi
# perilaku lama (keepalive `32`, dan `Connection ''` pada SSE /api/) tetap
# persis sama. map bersifat http-level; file ini di-include di dalam http{}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

