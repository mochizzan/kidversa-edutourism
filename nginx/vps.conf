# Kidversa Edutourism — VPS HOST nginx (bare metal, faces the internet).
# All app traffic is reverse-proxied here. Frontend & backend run in Docker
# containers; their ports are bound to 127.0.0.1 (not public). This host nginx
# is the only thing listening on :80/:443.
#
# Deploy steps on the VPS (root compose.yml is PRODUCTION-only: GHCR images,
# no `build:` — so there is nothing to build):
#   1. Copy this file to /etc/nginx/sites-available/kidversa.conf
#      and symlink into /etc/nginx/sites-enabled/ (rm the default site).
#   2. Adjust DOMAIN and the TLS cert paths in the commented go-live block below.
#   3. docker compose pull && docker compose up -d   (ports bound to 127.0.0.1)
#   4. nginx -t && systemctl reload nginx

# ─── Upstreams (container services on the Docker host bridge) ───
# frontend container (nginx:alpine) and backend container (Go) are reached via
# 127.0.0.1 since compose binds them to the host loopback.
upstream kidversa_frontend {
    server 127.0.0.1:8002;
    keepalive 32;
}
upstream kidversa_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ─── GO-LIVE (TLS): uncomment the two blocks below ONLY when a real domain
#      and Let's Encrypt certificates exist. Steps, in order:
#        1. Pick your domain and replace EVERY `DOMAIN.example.com` placeholder
#           below (server_name + both cert paths) with it.
#        2. Issue certs on the host, e.g.:
#             certbot certonly --webroot -w /var/www/certbot -d DOMAIN.example.com
#           (certbot's `--nginx` plugin works too; it needs this config syntactically
#           valid first — leave the blocks commented until the files exist, since
#           `ssl_certificate` pointing at a missing path makes `nginx -t` FAIL.)
#        3. Uncomment the HTTPS server block below.
#        4. Uncomment the HTTP → HTTPS redirect only after certs are in place;
#           keep the plain-HTTP server block (bottom of file) as the `:80`
#           fallback until then.
#        5. nginx -t && systemctl reload nginx
#      WHY HTTPS IS REQUIRED, NOT OPTIONAL: the backend hardcodes the auth
#      cookie with the `Secure` attribute (env vars are ignored by design), so
#      browsers will only send it over https:// — logging in on a public domain
#      over plain HTTP silently fails (session cookie is dropped).

# ─── HTTP → HTTPS redirect (only if you enable TLS below) ───
# server {
#     listen 80;
#     server_name DOMAIN.example.com;
#     return 301 https://$host$request_uri;
# }

# ─── HTTPS server (enable after issuing Let's Encrypt certs) ───
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name DOMAIN.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/DOMAIN.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/DOMAIN.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     client_max_body_size 32m;
#     server_tokens off;
#
#     # SPA static assets
#     location / {
#         proxy_pass http://kidversa_frontend;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Connection '';
#     }
#
#     # API reverse proxy → backend container
#     location /api/ {
#         proxy_pass http://kidversa_backend;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Connection '';
#         proxy_buffering off;
#         proxy_cache off;
#         proxy_read_timeout 86400s;   # SSE
#         proxy_hide_header Server;
#     }
#
#     # Health (optional)
#     location = /health {
#         proxy_pass http://kidversa_backend/health;
#     }
