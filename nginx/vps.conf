# ─── Plain HTTP server (use this until TLS certs exist) ───
server {
    listen 80;
    server_name _;   # or your DOMAIN

    client_max_body_size 32m;
    server_tokens off;

    # ─── Compression (Gzip) ───
    # The container frontend already gzips what it serves; this layer covers
    # responses proxied straight from the backend container (e.g. /api/ JSON).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    # SPA + static — served by the frontend container (nginx:alpine)
    location / {
        proxy_pass http://kidversa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # API reverse proxy → backend container (Go, :8080)
    location /api/ {
        proxy_pass http://kidversa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;   # SSE long-lived streams
        proxy_hide_header Server;

        # Re-declare security headers (same set as nginx/default.conf; own
        # add_header present → server-level inheritance drops otherwise).
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # Backend health (no /api prefix)
    location = /health {
        proxy_pass http://kidversa_backend/health;
    }
}
