# Kidversa Edutourism — centralized production reverse proxy (mounted read-only
# into the nginx container at /etc/nginx/conf.d/default.conf).
#
# This file is included inside the stock nginx.conf http{} block, so everything
# here MUST be valid in http/server/location context (no top-level events/http
# wrapper). All directives are kept inside the single `server {}` block for
# simplicity (Gzip-only compression; no Brotli build complexity).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression (Gzip only) ─────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_vary on;

    # ─── Base security headers (re-declared per-location below) ───
    add_header X-Content-Type-Options        "nosniff"                          always;
    add_header X-Frame-Options               "SAMEORIGIN"                       always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS / CSP are intentionally left commented: enable only with TLS termination at the edge.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # add_header Content-Security-Policy     "default-src 'self'"                 always;

    # Request body cap: >= backend UploadMaxMB (25m) with headroom for multipart.
    client_max_body_size 32m;

    # ─── SPA fallback: all routes → index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API reverse proxy → backend (SSE-capable) ────────────
    # No `upstream` block: proxy directly to the backend service container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Empty Connection header lets nginx reuse upstream keepalive + stream SSE.
        proxy_set_header Connection "";

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # Hide upstream (Go) identity from clients.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # SSE: no buffering/caching, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # Re-declare security headers (own add_header present → inheritance drops otherwise).
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    # ─── Static assets: cache aggressively ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    # ─── PWA service worker: never cache ──────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    # ─── Health check endpoint ────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=()" always;
    }
}
