# Kidversa Edutourism — centralized production reverse proxy (mounted read-only
# into the nginx container at /etc/nginx/conf.d/default.conf).
#
# This file is included inside the stock nginx.conf http{} block, so everything
# here MUST be valid in http/server/location context (no top-level events/http
# wrapper). All directives are kept inside the single `server {}` block for
# simplicity (Gzip-only compression; no Brotli build complexity).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Explicit `etag on` (audit P3-7): don't rely on nginx's default — makes
    # index.html/static revalidation self-documenting; /api/ ETags come from backend.
    etag on;

    # ─── Compression (Gzip only) ─────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 application/manifest+json;
    gzip_vary on;

    # ─── Base security headers (re-declared per-location below) ───
    add_header X-Content-Type-Options        "nosniff"                          always;
    add_header X-Frame-Options               "SAMEORIGIN"                       always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    # HSTS / CSP are intentionally left commented: enable only with TLS termination at the edge.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # add_header Content-Security-Policy     "default-src 'self'"                 always;

    # Request body cap: >= backend UploadMaxMB (25m) with headroom for multipart.
    client_max_body_size 32m;

    # ─── OpenWA Dashboard — QR login & session management ──────
    # `^~` = prefix priority. Without it the regex static-asset location
    # below outranks this plain prefix, so /wa/assets/*.js|css get looked up
    # (and 404) in THIS container's document root instead of being proxied.
    location ^~ /wa/ {
        # From inside this container, 127.0.0.1 is the container itself and
        # never reaches the wa-engine service — use the compose service DNS name.
        proxy_pass http://wa-engine:2785/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OpenWA is built with Vite base "/" and emits ROOT-absolute URLs in
        # its HTML (src="/assets/…, href="/favicon.svg). Behind this prefix
        # those resolve to the document root, where they either 404 or collide
        # with this app's own /assets namespace. Rewrite them to /wa/… so the
        # browser stays under the prefix this location owns. Only text/html is
        # rewritten; sub_filter needs an unencoded body, so drop the upstream
        # Content-Encoding (our own gzip below still compresses to the client).
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '"/assets/'     '"/wa/assets/';
        sub_filter '"/favicon.svg' '"/wa/favicon.svg';

        # The JS bundle is root-absolute too, and sub_filter defaults to
        # text/html only, so list the script MIME types explicitly (text/html
        # stays included — it is the module default, re-declaring it makes
        # nginx emit a "duplicate MIME type" warning).
        sub_filter_types application/javascript text/javascript;

        # OpenWA ships no base-path option (the dashboard is served from the
        # API image root), so the browser built every endpoint from `${BASE}/api`
        # with BASE="" — login (`POST /api/auth/validate`), the media/image blob
        # downloads and the rest all fell through to THIS app's Go backend and
        # 404'd. Rewrite the single place the base is assembled instead: the
        # `}`+`/api` fragment is identifier-independent and appears only there
        # (every other chunk was audited), so an upstream minifier rename of
        # BASE cannot silently break it. The socket.io path is likewise built
        # from window.location.origin, so it gets prefixed to keep the live
        # stream under /wa/ as well (Upgrade headers are already forwarded here).
        sub_filter '}/api'         '}/wa/api';
        sub_filter '`/socket.io`'  '`/wa/socket.io`';
    }

    # ─── SPA fallback: all routes → index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── App shell: always revalidate index.html ───────────────
    # Online replacement for the removed service-worker precache: HTML is the
    # only unhashed asset left, so every navigation must revalidate (ETag).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # ─── API reverse proxy → backend (SSE-capable) ────────────
    # No `upstream` block: proxy directly to the backend service container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Empty Connection header lets nginx reuse upstream keepalive + stream SSE.
        proxy_set_header Connection "";

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # Hide upstream (Go) identity from clients.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # SSE: no buffering/caching, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # Re-declare security headers (own add_header present → inheritance drops otherwise).
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # ─── Static assets: cache aggressively ────────────────────
    # This app's own /assets namespace wins: try_files resolves $uri against
    # the document root FIRST, so every Kidversa asset is served locally and
    # unchanged. Only a MISS falls through to /wa/, because OpenWA's
    # __vite__mapDeps/preload-helper builds chunk URLs as "/" + dep — root
    # absolute, created at runtime in JS, so sub_filter in the ^~ block above
    # can never see them. Same story for images the bundle hardcodes: the
    # dashboard's own logo is src="/openwa_logo.webp" (login + sidebar), and
    # without `webp` in this list it missed every location and fell to the
    # SPA fallback, handing an <img> the index.html document instead of a
    # picture. The internal redirect re-enters location matching, hits
    # ^~ /wa/, and lands on wa-engine.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri /wa$uri;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # ─── PWA service worker: never cache ──────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }

    # ─── Health check endpoint ────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), payment=()" always;
    }
}
