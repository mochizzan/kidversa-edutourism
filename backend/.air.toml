# air — Go live-reload config for Docker dev
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Build the server binary
  entrypoint = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "uploads", "vendor", "migrations"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "toml", "yaml", "sql"]
  kill_delay = "5s"
  send_interrupt = false
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
