# Kidversa Edutourism — Production compose (no dev / watch / profile config).
#
#   docker compose up -d --build     ← build + run the production stack
#   docker compose down              ← stop stack (does NOT touch bind-mount data)
#   docker compose logs -f backend
#
#   Host ports (bound to 127.0.0.1):  MariaDB 3307  •  backend 8080  •  frontend 8002  •  wa-engine 2785
#   On a VPS, the HOST nginx (see nginx/vps.conf) is the only public entry point
#   and reverse-proxies to these loopback-bound container ports.
#   Local dev: also reachable at http://localhost:8002 (localhost == 127.0.0.1).
#
# Conventions:
#   - Bind mounts only (relative to this file / cwd). No named volumes.
#   - Simple, default container config (no read_only/tmpfs/cap_drop) for
#     reliable startup; resource limits via deploy.resources still applied.
#   - Secrets come from the host file ./backend/.env (never baked into images).
#   - All container ports published to 127.0.0.1 only (not public).

services:
  mariadb:
    image: mariadb:12
    environment:
      # Overridable; defaults to a weak local-only value. Set in the environment
      # for any real deployment.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      # Bind mount — data lives on the host under ./data/mariadb.
      # NOTE: `compose down` never removes this; to reset, empty the folder
      # via File Explorer / WSL2, not `down -v` (bind mounts aren't removed).
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      # Override: in Docker, DB_HOST = service name (not localhost).
      DB_HOST: mariadb
      TEST_DB_HOST: mariadb
    ports:
      - "127.0.0.1:8080:8080"
    # Relative bind mount for uploads (persisted on host).
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # busybox wget on alpine has no --spider; use GET → /dev/null.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    # Resource limits (no Swarm required for compose v2 / file >= 3.4)
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 200
        reservations:
          cpus: "0.25"
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Centralized, bind-mounted reverse-proxy config (read-only at runtime).
    # Published to 127.0.0.1:8002 only; the host nginx (nginx/vps.conf) proxies
    # public traffic here. Internal container port stays 8080.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8002:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 100
        reservations:
          cpus: "0.10"
          memory: 64M

  wa-engine:
    image: ghcr.io/rmyndharis/openwa:latest
    environment:
      ENGINE_TYPE: baileys
      PORT: "2785"
      API_PORT: "2785"
      AUTO_START_SESSIONS: "true"
      DATABASE_TYPE: sqlite
      LOG_LEVEL: info
      # Session name: backend searches by this name, not UUID.
      # Create session via dashboard or: POST /api/sessions {"name":"main"}
    ports:
      - "127.0.0.1:2785:2785"
    volumes:
      - ./data/wa-engine:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
